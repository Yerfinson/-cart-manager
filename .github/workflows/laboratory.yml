# Prompt: build validation on merge to laboratory branch
# Step 1: checkout, setup Node 22.x, install deps
# Step 2: run production build to validate bundle

name: Laboratory Build

on:
  push:
    branches: [laboratory]

jobs:
  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npx ng build --configuration production
