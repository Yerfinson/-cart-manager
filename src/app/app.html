<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">Cart Manager</span>
    <div class="d-flex gap-2">
      <button
        class="btn btn-sm"
        [class.btn-light]="activeTab() === 'products'"
        [class.btn-outline-light]="activeTab() !== 'products'"
        (click)="activeTab.set('products')">
        Products
      </button>
      <button
        class="btn btn-sm"
        [class.btn-light]="activeTab() === 'cart'"
        [class.btn-outline-light]="activeTab() !== 'cart'"
        (click)="activeTab.set('cart')">
        Cart
      </button>
    </div>
  </div>
</nav>

<div class="container pb-5">
  @if (activeTab() === 'products') {
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">Products</h2>
      <button class="btn btn-success" (click)="onAddNew()">+ Add Product</button>
    </div>

    @if (showForm()) {
      <app-product-form
        [productToEdit]="productToEdit()"
        (formClosed)="onFormClosed()">
      </app-product-form>
    }

    <app-product-list (editProduct)="onEditProduct($event)"></app-product-list>
  }

  @if (activeTab() === 'cart') {
    <h2 class="mb-4">Shopping Cart</h2>
    <app-cart></app-cart>
  }
</div>
