<header class="app-header border-bottom mb-5">
  <div class="container d-flex justify-content-between align-items-center py-3">
    <div>
      <h1 class="h5 fw-bold mb-0">Cart Manager</h1>
      <small class="text-muted">Product management</small>
    </div>
    <nav class="d-flex gap-1">
      <button
        class="btn btn-sm px-4"
        [class.btn-dark]="activeTab() === 'products'"
        [class.btn-outline-secondary]="activeTab() !== 'products'"
        (click)="activeTab.set('products')">
        Products
      </button>
      <button
        class="btn btn-sm px-4"
        [class.btn-dark]="activeTab() === 'cart'"
        [class.btn-outline-secondary]="activeTab() !== 'cart'"
        (click)="activeTab.set('cart')">
        Cart
      </button>
    </nav>
  </div>
</header>

<main class="container pb-5">
  @if (activeTab() === 'products') {
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="h4 fw-bold mb-0">Products</h2>
      @if (!showForm()) {
        <button class="btn btn-dark btn-sm px-4" (click)="onAddNew()">+ New product</button>
      }
    </div>

    @if (showForm()) {
      <app-product-form
        [productToEdit]="productToEdit()"
        (formClosed)="onFormClosed()">
      </app-product-form>
    }

    <app-product-list (editProduct)="onEditProduct($event)"></app-product-list>
  }

  @if (activeTab() === 'cart') {
    <h2 class="h4 fw-bold mb-4">Shopping Cart</h2>
    <app-cart></app-cart>
  }
</main>
