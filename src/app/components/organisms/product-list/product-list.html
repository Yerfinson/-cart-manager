<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
  @for (product of products(); track product.id) {
  <div class="col">
    <div class="card h-100 border-0 shadow-sm product-card">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <span class="badge badge-category">{{ product.category }}</span>
          <span class="text-muted small">
            {{ product.stock > 0 ? product.stock + ' left' : 'Out of stock' }}
          </span>
        </div>
        <h5 class="card-title fw-semibold mb-1">{{ product.name }}</h5>
        <p class="card-text text-muted small mb-3">{{ product.description }}</p>
        <p class="price-tag mb-0">${{ product.price | number:'1.2-2' }}</p>
      </div>
      <div class="card-footer border-0 bg-transparent px-4 pb-4 d-flex gap-2">
        <button
          class="btn btn-dark btn-sm flex-grow-1"
          (click)="addToCart(product)"
          [disabled]="product.stock === 0"
        >
          Add to cart
        </button>
        <button
          class="btn btn-outline-secondary btn-sm px-3"
          (click)="onEdit(product)"
          title="Edit"
        >
          ✏️
        </button>
        <button
          class="btn btn-outline-danger btn-sm px-3"
          (click)="onDelete(product)"
          title="Delete"
        >
          🗑️
        </button>
      </div>
    </div>
  </div>
  } @empty {
  <div class="col-12">
    <div class="empty-state text-center py-5">
      <div class="fs-1 mb-2">📦</div>
      <p class="text-muted">No products yet. Add your first one!</p>
    </div>
  </div>
  }
</div>
