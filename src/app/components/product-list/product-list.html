<div class="row row-cols-1 row-cols-md-3 g-4">
  @for (product of products(); track product.id) {
    <div class="col">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <span class="badge bg-secondary mb-2">{{ product.category }}</span>
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text text-muted small">{{ product.description }}</p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="fs-5 fw-bold text-success">${{ product.price | number:'1.2-2' }}</span>
            <span class="text-muted small">Stock: {{ product.stock }}</span>
          </div>
        </div>
        <div class="card-footer bg-transparent d-flex gap-2">
          <button
            class="btn btn-primary btn-sm flex-grow-1"
            (click)="addToCart(product)"
            [disabled]="product.stock === 0">
            {{ product.stock === 0 ? 'Out of stock' : 'Add to cart' }}
          </button>
          <button class="btn btn-outline-secondary btn-sm" (click)="onEdit(product)">Edit</button>
          <button class="btn btn-outline-danger btn-sm" (click)="onDelete(product.id)">Delete</button>
        </div>
      </div>
    </div>
  } @empty {
    <div class="col-12">
      <div class="alert alert-info text-center">No products available. Add one!</div>
    </div>
  }
</div>
